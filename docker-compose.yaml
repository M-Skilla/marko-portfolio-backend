services:
  postgres:
    image: postgres:16-alpine
    container_name: postgresdb
    environment:
      POSTGRES_DB: portfoliodb
      POSTGRES_USER: marko
      POSTGRES_PASSWORD: 2323
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U marko -d portfoliodb" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ${REGISTRY}/${IMAGE_NAME}:latest
    container_name: app
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portfoliodb
      SPRING_DATASOURCE_USERNAME: marko
      SPRING_DATASOURCE_PASSWORD: 2323
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: